  <!-- If anything goes wrong, say so on screen (instead of a frozen game) so it can be reported. -->
  <script>
    (function () {
      var shown = 0;
      function report(msg, where) {
        if (shown++ > 2) return;
        var box = document.getElementById('fg-error');
        if (!box) {
          box = document.createElement('div'); box.id = 'fg-error';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:10px 12px;background:#2a0d10;border:2px solid #ff3d3d;color:#ffd0c8;font:13px/1.4 monospace;white-space:pre-wrap;';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += (box.textContent ? '\n' : 'Something went wrong. If this keeps happening, reload with Ctrl+Shift+R (Cmd+Shift+R on Mac) to clear old cached files.\n') + msg + (where ? '  (' + where + ')' : '');
      }
      window.addEventListener('error', function (e) {
        var f = (e.filename || '').split('/').slice(-2).join('/').replace(/\?.*$/, '');
        report(e.message || String(e.error), f ? f + ':' + e.lineno : '');
      });
      window.addEventListener('unhandledrejection', function (e) { report('Unhandled: ' + (e.reason && e.reason.message || e.reason)); });
    })();
  </script>
